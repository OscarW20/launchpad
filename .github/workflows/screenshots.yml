name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Launchpad.app
        run: ./scripts/make-app.sh
      - name: Demo data
        run: LAUNCHPAD_HOME="$RUNNER_TEMP/demo" python3 scripts/demo-data.py
      - name: Screenshots (dark and light)
        run: |
          mkdir -p shots
          for mode in dark light; do
            rm -rf "$RUNNER_TEMP/demo" && LAUNCHPAD_HOME="$RUNNER_TEMP/demo" python3 scripts/demo-data.py
            if [ $mode = dark ]; then ARGS="-AppleInterfaceStyle Dark"; else ARGS=""; fi
            LAUNCHPAD_HOME="$RUNNER_TEMP/demo" dist/Launchpad.app/Contents/MacOS/Launchpad $ARGS &
            PID=$!
            sleep 12
            osascript -e 'tell application "System Events" to tell (first process whose unix id is '"$PID"') to set frontmost to true' || true
            osascript -e 'tell application "System Events" to tell (first process whose unix id is '"$PID"') to set position of window 1 to {0, 25}' || true
            osascript -e 'tell application "System Events" to tell (first process whose unix id is '"$PID"') to set size of window 1 to {1440, 900}' || true
            sleep 4
            screencapture -x "shots/$mode-full.png" || true
            kill $PID || true
            sleep 2
          done
          ls -la shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shots/
