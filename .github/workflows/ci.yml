name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: Build app and run tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle Launchpad.app
        run: ./scripts/make-app.sh
