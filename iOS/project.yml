# XcodeGen spec for the Launchpad iPhone companion: `cd iOS && xcodegen generate`.
# LaunchpadPhone.xcodeproj is checked in too, so Xcode alone is enough; CI builds both.
name: LaunchpadPhone
options:
  bundleIdPrefix: app.launchpad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your own team in Xcode (Signing & Capabilities) to run on a phone.
    DEVELOPMENT_TEAM: ""
targets:
  LaunchpadPhone:
    type: application
    platform: iOS
    sources:
      - path: LaunchpadPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.launchpad.phone
        PRODUCT_NAME: Launchpad
        TARGETED_DEVICE_FAMILY: "1"
        # No app icon yet (the app will be restyled); XcodeGen would otherwise expect "AppIcon".
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LaunchpadPhone/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Launchpad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Launchpad finds your Mac on this Wi-Fi so you can chat with your bots.
    scheme: {}
